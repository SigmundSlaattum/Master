<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODrive Sinusoidal Position Estimator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; background: #eee; padding: 15px; border-radius: 8px; }
        .control-group { display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 0.9em; margin-bottom: 5px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .results { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #eef7ff; padding: 15px; border-radius: 8px; border-left: 5px solid #007bff; }
        canvas { max-height: 400px; width: 100%; }
        .note { font-size: 0.85em; color: #666; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>ODrive Position Estimator (50Hz Ref)</h2>

    <div class="controls">
        <div class="control-group">
            <label>Update Rate (Hz)</label>
            <input type="number" id="refreshRate" value="50" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>Sine Amplitude (Load Degrees)</label>
            <input type="number" id="amplitude" value="45" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>Sine Period (Seconds)</label>
            <input type="number" id="period" value="2.0" step="0.1" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>Gear Stage 1 (1:X)</label>
            <input type="number" id="gear1" value="15" oninput="updateSimulation()">
        </div>
        <div class="control-group">
            <label>Gear Stage 2 (1:X)</label>
            <input type="number" id="gear2" value="2" oninput="updateSimulation()">
        </div>
    </div>

    <div class="results">
        <div class="card">
            <h3>System Ratio</h3>
            <p>Total Reduction: <strong id="totalRatio">30</strong>:1</p>
            <p>1 Load Turn = <strong id="motorTurnsResult">30</strong> Motor Turns</p>
        </div>
        <div class="card">
            <h3>Peak Velocity Est.</h3>
            <p>Load: <strong id="velLoad">0</strong> deg/s</p>
            <p>Motor: <strong id="velMotor">0</strong> turns/s</p>
        </div>
    </div>

    <canvas id="myChart"></canvas>
    <p class="note">The "Stepped" line represents the actual discrete commands sent to the ODrive every 20ms (50Hz).</p>
</div>

<script>
    let myChart = null;

    function updateSimulation() {
        // Inputs
        const rate = parseFloat(document.getElementById('refreshRate').value);
        const amp = parseFloat(document.getElementById('amplitude').value);
        const period = parseFloat(document.getElementById('period').value);
        const g1 = parseFloat(document.getElementById('gear1').value);
        const g2 = parseFloat(document.getElementById('gear2').value);
        
        // Calculations
        const gearRatio = g1 * g2;
        const dt = 1 / rate; // Time step in seconds
        const totalTime = period * 1.5; // Show 1.5 cycles
        
        // Update Text Stats
        document.getElementById('totalRatio').innerText = gearRatio;
        document.getElementById('motorTurnsResult').innerText = gearRatio;
        
        // Peak Velocity Calculation: derivative of A*sin(wt) is A*w*cos(wt). Max is A*w.
        // w = 2*pi/T. 
        const w = (2 * Math.PI) / period;
        const maxVelDeg = amp * w; // degrees per second
        const maxVelMotor = (maxVelDeg / 360) * gearRatio; // turns per second
        
        document.getElementById('velLoad').innerText = maxVelDeg.toFixed(1);
        document.getElementById('velMotor').innerText = maxVelMotor.toFixed(2);

        // Generate Data Points
        const labels = [];
        const idealData = [];
        const discreteData = [];
        
        // High res simulation for the smooth line
        for (let t = 0; t <= totalTime; t += totalTime/200) {
            // Load position in degrees
            const loadPos = amp * Math.sin(w * t);
            // Convert to Motor Turns: (Degrees / 360) * GearRatio
            const motorPos = (loadPos / 360) * gearRatio;
            idealData.push({x: t, y: motorPos});
        }

        // Discrete simulation (50Hz steps)
        let lastStepTime = 0;
        for (let t = 0; t <= totalTime; t += 0.001) { // Visualization resolution
            // Check if we hit a refresh window
            if (t >= lastStepTime) {
                const loadPos = amp * Math.sin(w * t);
                const motorPos = (loadPos / 360) * gearRatio;
                
                // Hold this value until next step
                discreteData.push({x: t, y: motorPos});
                discreteData.push({x: t + dt, y: motorPos}); // Step hold
                
                lastStepTime += dt;
            }
        }

        renderChart(idealData, discreteData);
    }

    function renderChart(ideal, discrete) {
        const ctx = document.getElementById('myChart').getContext('2d');
        
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [
                    {
                        label: 'Ideal Trajectory (Motor Turns)',
                        data: ideal,
                        borderColor: 'rgba(150, 150, 150, 0.5)',
                        borderWidth: 2,
                        showLine: true,
                        pointRadius: 0
                    },
                    {
                        label: '50Hz Command Input (Stepped)',
                        data: discrete,
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 2,
                        showLine: true,
                        pointRadius: 0,
                        stepped: true
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        title: { display: true, text: 'Time (seconds)' }
                    },
                    y: {
                        title: { display: true, text: 'Position (Motor Turns)' }
                    }
                },
                plugins: {
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                    }
                }
            }
        });
    }

    // Initialize
    updateSimulation();
</script>

</body>
</html>
